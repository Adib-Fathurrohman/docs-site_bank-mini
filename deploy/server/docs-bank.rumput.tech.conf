# Rumput Bank Mini documentation site (static Astro Starlight build).
# Files: /var/www/rumput/bank-mini/docs/current (deploy-docs.sh). See README.md.
server {
    listen 80;
    listen [::]:80;
    server_name docs-bank.rumput.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rumput/bank-mini/tmp/acme;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docs-bank.rumput.tech;

    ssl_certificate     /etc/letsencrypt/live/docs-bank.rumput.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs-bank.rumput.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/rumput/bank-mini/docs/current;
    index index.html;
    charset utf-8;
    access_log /var/log/nginx/docs-bank.rumput.tech.access.log;
    error_log  /var/log/nginx/docs-bank.rumput.tech.error.log;

    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;

    # Repeated in every location that adds its own headers (nginx does not inherit them).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    error_page 404 /404.html;

    # Hashed build files: cache for a year.
    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location ~ /\. { deny all; }

    # Pages are folders with index.html (/api/teller/); the search index is plain files.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
